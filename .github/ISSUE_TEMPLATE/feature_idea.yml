name: Feature idea
description: Suggest something new or a better way to do something
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps
      description: What kind of map or event is it for (sprint, forest, club training, school...)?
  - type: dropdown
    id: use
    attributes:
      label: How do you use the app?
      options: [Personal / hobby, Club or federation, School, Commercial]
