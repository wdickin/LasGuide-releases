name: Bug report
description: Something in Karttapullautin GUI doesn't work right
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make the app better! Please don't attach large LiDAR files. A link or the area name is enough.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Help > About (for example 1.3.2)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Computer
      options: [Windows, macOS (Apple chip), macOS (Intel), Linux]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you click, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: LiDAR data and area
      description: Where the data came from (your own files, USGS, NRCan, LidarBC...) and roughly where.
  - type: textarea
    id: log
    attributes:
      label: Log or screenshot
      description: Paste from Help > Diagnostics, or drag in a screenshot.
